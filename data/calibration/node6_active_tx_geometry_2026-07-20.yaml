    current_position_source: updated_numbered_room_jpg_2026_07_20_node_6_left_wall
    description: node 6 active illuminator/TX; numbered red square on west/left wall near router/AP area, at jeans-pocket/hip height
    xyz_m: [0.08, 1.25, 0.85]
    height_label: jeans_pocket_hip
    placement_update_needed: false
    antenna_orientation: unknown
    usb_power: SER8_or_reliable_USB
    uart_observability: preferred_when_experimenting
    position_notes:
      - Corrected after Dave numbered the sketch. Node 6 is on the west/left wall, not the right/east wall.
      - Estimated from numbered room.jpg by mapping node 6 red square centre to room coordinates.
      - x/y estimate is strong; height updated from Dave's note that node 6 is about where the pocket is in his jeans.
      - z=0.85m is an approximate jeans-pocket/hip-height working value; refine if measured.
      - This supersedes both the old south/bottom-middle node 6 guess [1.95, 4.95, 1.0] and the mistaken unnumbered-sketch right-wall estimate [4.05, 2.30, 0.85].
    expected_use:
