  1:
    role: rx_witness
    current_position_source: updated_numbered_room_jpg_2026_07_20
    description: node 1; top/north wall near north-west corner
    xyz_m: [0.42, 0.05, 1.0]
    height_label: waist
    placement_update_needed: false
