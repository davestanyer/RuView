    antenna_orientation: unknown
    occlusion_notes:
      - Dave confirmed node 4 is on the right wall middle at mid/upper-body height.
      - Numbered sketch resolves prior conflict: node 4 is right wall; node 6 is left wall TX.
    expected_use:
