      - movement_witness
  5:
    role: rx_witness
    current_position_source: updated_numbered_room_jpg_2026_07_20
    description: node 5; south-east/bottom-right
    xyz_m: [3.80, 4.91, 0.5]
    height_label: knee
    placement_update_needed: false
    antenna_orientation: unknown
    occlusion_notes: []
    expected_use:
      - floor_or_leg_motion_witness
