# Link/path geometry from TX node 6 to each RX witness.
# Dave can update `path_role` and notes after correcting physical node positions.
# Later we can compute line/zone intersections automatically from tx/rx xyz + zone rectangles.
links:
  tx6_rx1:
    tx: 6
    rx: 1
    path_role: west_wall_tx_to_north_west_short_upper_path
    expected_zone_sensitivity:
      desk: low_candidate
      near_desk: medium_candidate
      centre: low_candidate
      door: unknown
      empty: background
    reliability_prior: 0.55
    notes:
      - Node 6 and node 1 are both on/near the west/north-west side; likely useful for local west/top context rather than full desk-crossing geometry.
  tx6_rx2:
    tx: 6
    rx: 2
    path_role: west_wall_tx_to_north_desk_rx_candidate
    expected_zone_sensitivity:
      desk: high_candidate
      near_desk: high_candidate
      centre: medium_candidate
      door: unknown
      empty: background
    reliability_prior: 0.9
    notes:
      - Numbered map puts node 2 above the desk; TX6->RX2 likely crosses Dave's desk/near-desk region and should be a high-value active-TX localisation path.
  tx6_rx3:
    tx: 6
    rx: 3
    path_role: west_wall_tx_to_north_east_long_desk_diagonal
    expected_zone_sensitivity:
      desk: high_candidate
      near_desk: high_candidate
      centre: medium_candidate
      door: unknown
      empty: background
    reliability_prior: 0.85
    notes:
      - With node 6 on the west wall and node 3 in the north-east, this diagonal likely crosses the desk/upper-room region and may be one of the strongest desk-zone paths.
  tx6_rx4:
    tx: 6
    rx: 4
    path_role: west_wall_tx_to_east_wall_mid_cross_room_path
    expected_zone_sensitivity:
      desk: medium_candidate
      near_desk: high_candidate
      centre: high_candidate
      door: unknown
      empty: background
    reliability_prior: 0.8
    notes:
      - Numbered sketch resolves prior node 4/node 6 conflict: node 6 is west/left wall TX and node 4 is east/right wall mid receiver.
      - This cross-room path should be useful for near-desk, centre, and general movement localisation.
  tx6_rx5:
    tx: 6
    rx: 5
    path_role: west_wall_tx_to_south_east_long_lower_diagonal
    expected_zone_sensitivity:
      desk: medium_candidate
      near_desk: medium_candidate
      centre: high_candidate
      door: unknown
      empty: background
    reliability_prior: 0.65
    notes:
      - Long low diagonal from west-wall TX to south-east floor/knee node; likely stronger for centre/lower-body movement and leaving/door paths than seated torso.

zones:
  empty:
    label: empty
    description: no person in room
    geometry: whole_room_no_occupant
  desk:
    label: desk
    description: Dave seated at normal desk position
    approx_rect_m:
