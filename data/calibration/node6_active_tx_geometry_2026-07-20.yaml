# RuView active-TX room geometry calibration
# Created: 2026-07-20 by Zugg for Dave to edit.
# Purpose: explicitly model node 6 as active illuminator/TX and nodes 1-5 as RX witnesses.
#
# Coordinate system copied from the 2026-06-26 room map:
# - origin: north-west/top-left room corner
# - x_m increases east/right
# - y_m increases south/down
# - z_m is height from floor
#
# Dave: update all approximate positions/descriptions below to match where the nodes actually are now.
# Keep units in metres. If unsure, write null and add a note.

schema_version: 1
created: "2026-07-20"
name: office_node6_active_tx_geometry
source_maps:
  previous_geometry: /home/davestanyer/.local/share/ruview/data/calibration/node_geometry_office_2026-06-26.yaml
  source_sketch: /home/davestanyer/Documents/INFO/room.jpg
  repo_sketch_copy: /home/davestanyer/RuView-upstream-main/data/calibration/office_room_map_2026-06-26.jpg
  latest_sketch_observation:
    date: "2026-07-20"
    note: Dave updated room.jpg with numbers; node 6 is the numbered red square on the west/left wall, not the right-wall square. Earlier unnumbered-sketch inference was wrong.
    numbered_node_xy_m_from_sketch:
      1: [0.42, 0.05]
      2: [1.79, 0.08]
      3: [4.04, 0.25]
      4: [4.05, 2.30]
      5: [3.80, 4.91]
      6: [0.08, 1.25]
  latest_height_observation:
    date: "2026-07-20"
    note: Dave said node 6 is about where the pocket is in his jeans.
    estimated_node6_z_m: 0.85
  latest_node4_observation:
    date: "2026-07-20"
    note: Dave said node 4 is on the right wall middle, about mid/upper-body height. Numbered sketch confirms this as node 4.
    estimated_node4_xyz_m: [4.05, 2.30, 1.45]
  correction_note:
    date: "2026-07-20"
    note: Numbered sketch resolves prior node 4/node 6 conflict. Node 4 is right wall middle; node 6 active TX is left/west wall around y=1.25.

room:
  name: office
  width_m: 4.14
  depth_m: 5.0
  coordinate_origin: north_west_top_left
  notes:
    - Update width/depth if the old sketch dimensions are now wrong.
    - This file is for active-TX localisation/zone modelling, not broad presence only.

landmarks:
  router_or_ap:
    description: old router/AP estimate from prior sketch; not the active-TX source for this geometry pass
    xy_m: [0.28, 1.72]
    notes:
      - Keep for context, but active paths below use node 6 as TX.
  dave_usual_desk_position:
    description: usual seated/standing desk position
    xy_m: [1.32, 1.25]
    z_reference_m: 1.2
    zone: desk
    update_needed: true
  desk:
    description: desk area / primary work zone
    approx_rect_m:
      x_min: 0.15
      x_max: 2.85
      y_min: 0.30
      y_max: 0.95
    update_needed: true
  door_or_exit:
    description: add actual doorway / leaving-zone position
    xy_m: null
    approx_rect_m: null
    update_needed: true
  centre_room:
    description: approximate open centre / walking zone
    xy_m: [2.07, 2.50]
    update_needed: true

height_reference:
  floor_m: 0.0
  knee_m: 0.5
  waist_m: 1.0
  chest_m: 1.35
  head_m: 1.65
  high_reach_m: 2.1

active_tx:
  tx_node_id: 6
  mode: active_illuminator
  cadence_ms: 200
  wifi_mode: joins_normal_wifi_no_new_network
  notes:
    - Node 6 emits periodic WiFi frames and remains manageable on normal WiFi.
    - Receiver nodes must eventually identify node 6 frames separately from router/AP traffic for true link-aware localisation.
    - Current live API still reports node 6 as an active CSI stream too; treat node6_rx as diagnostic unless proven useful.
    - This map should drive zone/reliability features; it is not yet wired into the product runtime.

